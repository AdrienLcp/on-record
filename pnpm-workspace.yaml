packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

engineStrict: true

# A release younger than a day is not installed: most hijacked npm versions
# are pulled within hours. Pin the previous version when a fresh one is needed.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@adrienlcp/*'

publicHoistPattern:
  - '@biomejs/*'
