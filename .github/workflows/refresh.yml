name: Refresh and deploy

on:
  schedule:
    # Sources are rebuilt between 22:00 and 06:00 UTC.
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the datasets even if no source changed
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # The downloaded zips with their ETags: a night with no new source
      # downloads nothing and deploys nothing.
      - uses: actions/cache/restore@v5
        with:
          path: .cache
          key: open-data-zips-${{ github.run_id }}
          restore-keys: open-data-zips-

      # The datasets, keyed by the code that shapes them: a change to ingest or
      # protocol finds none and rebuilds them from the cached zips.
      - uses: actions/cache/restore@v5
        with:
          path: .data
          key: datasets-${{ hashFiles('apps/ingest/src/**', 'packages/protocol/src/**') }}-${{ github.run_id }}
          restore-keys: datasets-${{ hashFiles('apps/ingest/src/**', 'packages/protocol/src/**') }}-

      - name: Ingest
        id: ingest
        run: pnpm ingest
        env:
          INGEST_FORCE: ${{ inputs.force || 'false' }}

      - uses: actions/cache/save@v5
        if: steps.ingest.outputs.changed == 'true'
        with:
          path: .cache
          key: open-data-zips-${{ github.run_id }}

      - uses: actions/cache/save@v5
        if: steps.ingest.outputs.changed == 'true'
        with:
          path: .data
          key: datasets-${{ hashFiles('apps/ingest/src/**', 'packages/protocol/src/**') }}-${{ github.run_id }}

      - name: Build
        if: steps.ingest.outputs.changed == 'true' || github.event_name != 'schedule'
        run: pnpm build

      # Deploys are not queued in a concurrency group: GitHub cancels, and mails,
      # a run left waiting there. An older commit skips its deploy instead.
      - name: Check this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is-head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.head.outputs.is-head == 'true' && (steps.ingest.outputs.changed == 'true' || github.event_name != 'schedule') && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler pages deploy apps/web/dist --project-name on-record --branch main
