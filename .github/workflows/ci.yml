name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      # The prerender writes pages from the ingested datasets, which CI does
      # not download: everything up to it is built, the nightly refresh runs
      # the whole `pnpm build`.
      - name: Build
        run: >-
          pnpm --filter '!@on-record/web' -r build &&
          pnpm --filter @on-record/web typecheck &&
          pnpm --filter @on-record/web build:client &&
          pnpm --filter @on-record/web build:ssr

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        run: |
          node -p "'Line coverage: ' + require('./coverage/coverage-summary.json').total.lines.pct + '%'" >> "$GITHUB_STEP_SUMMARY"

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
